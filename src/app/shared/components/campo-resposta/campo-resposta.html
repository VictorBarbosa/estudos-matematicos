<div class="campo" [attr.data-estado]="estado()">
  <label [attr.for]="id">{{ rotulo() }}</label>
  <input
    #entrada
    type="text"
    inputmode="text"
    autocomplete="off"
    spellcheck="false"
    [attr.id]="id"
    [attr.placeholder]="ajuda()"
    [attr.aria-describedby]="ajuda() ? id + '-ajuda' : null"
    [value]="valor()"
    [disabled]="bloqueado()"
    (input)="aoDigitar($any($event.target))"
    (keydown.enter)="enviar.emit()"
  />
  @if (simbolos().length > 0) {
    <!-- ∀, ∈ e ∑ não estão no teclado de ninguém. -->
    <div class="simbolos" role="group" [attr.aria-label]="i18n.t('campo.simbolos')">
      @for (tecla of simbolos(); track tecla.rotulo) {
        <button
          type="button"
          [disabled]="bloqueado()"
          [attr.aria-label]="tecla.nome"
          [title]="tecla.nome"
          (click)="inserir(tecla)"
        >
          {{ tecla.rotulo }}
        </button>
      }
    </div>
  }

  @if (ajuda(); as texto) {
    <p class="ajuda" [attr.id]="id + '-ajuda'">{{ texto }}</p>
  }
</div>
