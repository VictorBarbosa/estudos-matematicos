<div class="controle">
  <label class="rotulo" [attr.for]="id">
    {{ rotulo() }}
    <output class="valor">{{ valor() }}</output>
  </label>

  <div class="entradas">
    <input
      type="range"
      class="deslizante"
      [attr.id]="id"
      [min]="min()"
      [max]="max()"
      [step]="passo()"
      [value]="valor()"
      (input)="aoDigitar($event)"
      [attr.aria-describedby]="dica() ? id + '-dica' : null"
    />
    <input
      type="number"
      class="numero"
      [min]="min()"
      [max]="max()"
      [step]="passo()"
      [value]="valor()"
      (input)="aoDigitar($event)"
      [attr.aria-label]="i18n.t('controle.valorExato', { rotulo: rotulo() })"
    />
  </div>

  @if (dica(); as texto) {
    <p class="dica" [attr.id]="id + '-dica'">{{ texto }}</p>
  }
</div>
