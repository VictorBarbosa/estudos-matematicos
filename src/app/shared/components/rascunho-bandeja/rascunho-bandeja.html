<div class="teclas" role="group" [attr.aria-label]="i18n.t('rascunho.bandeja')">
  @for (tecla of teclas; track tecla.nome) {
    <button
      type="button"
      class="tecla"
      [class]="tecla.classe"
      [attr.aria-label]="i18n.t('rascunho.tecla.' + tecla.nome)"
      [title]="i18n.t('rascunho.tecla.' + tecla.nome)"
      (click)="aoTocar(tecla)"
    >
      <span aria-hidden="true">{{ tecla.rotulo }}</span>
    </button>
  }
</div>
