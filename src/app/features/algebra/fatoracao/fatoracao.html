<app-topico-layout topicoId="fatoracao">
  <div explorar class="explorar">
    <section class="painel grade-controles">
      <app-controle-parametro
        [(valor)]="a"
        [rotulo]="i18n.t('explorar.coefX2')"
        [min]="0"
        [max]="6"
      />
      <app-controle-parametro
        [(valor)]="b"
        [rotulo]="i18n.t('explorar.coefX')"
        [min]="-12"
        [max]="12"
      />
      <app-controle-parametro
        [(valor)]="c"
        [rotulo]="i18n.t('explorar.termoConstante')"
        [min]="-20"
        [max]="20"
      />
    </section>

    <section class="destaque-formula">
      @if (fatorou()) {
        <app-formula
          [tex]="polinomio().paraTex() + ' = ' + fatoracao().resultado.tex"
          [bloco]="true"
        />
        <p class="observacao tipo">{{ tipoLegivel() }}</p>
      } @else {
        <app-formula [tex]="polinomio().paraTex()" [bloco]="true" />
        <p class="observacao tipo">{{ tipoLegivel() }}</p>
      }
    </section>

    <section>
      <h2>{{ texto('ondeSeAnula') }}</h2>
      <app-math-plot
        [dominio]="dominio()"
        [curvas]="curvas()"
        [pontos]="pontos()"
        [descricao]="descricaoGrafico()"
        [altura]="340"
      />
      <p class="observacao">{{ texto('cadaFator') }}</p>
    </section>

    <section>
      <h2>{{ i18n.t('explorar.passoAPasso') }}</h2>
      <app-passo-a-passo [passos]="fatoracao().passos" />
    </section>

    <app-conceitos-topico [conceitos]="conceitos" />
  </div>

  <div treinar>
    <app-area-treino [gerador]="gerador" />
  </div>
</app-topico-layout>
