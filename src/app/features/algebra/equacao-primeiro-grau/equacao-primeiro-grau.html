<app-topico-layout topicoId="equacao-primeiro-grau">
  <div explorar class="explorar">
    <section class="controles">
      <app-controle-parametro
        [(valor)]="a"
        [rotulo]="i18n.t('explorar.coefA')"
        [min]="-10"
        [max]="10"
      />
      <app-controle-parametro
        [(valor)]="b"
        [rotulo]="i18n.t('explorar.termoB')"
        [min]="-20"
        [max]="20"
      />
      <app-controle-parametro
        [(valor)]="c"
        [rotulo]="texto('ladoDireitoC')"
        [min]="-20"
        [max]="20"
      />
    </section>

    <section class="equacao">
      <app-formula [tex]="equacaoTex()" [bloco]="true" />
      @if (erro(); as mensagem) {
        <p class="aviso" role="alert">{{ mensagem }}</p>
      } @else if (raiz(); as solucao) {
        <app-formula [tex]="'x = ' + solucao.raiz.paraTex()" [bloco]="true" />
      }
    </section>

    @if (!erro()) {
      <section class="grafico">
        <h2>{{ texto('raizOndeCruzam') }}</h2>
        <app-math-plot
          [dominio]="dominio()"
          [curvas]="curvas()"
          [pontos]="pontos()"
          [descricao]="descricaoGrafico()"
          [altura]="360"
        />
        <p class="observacao">{{ texto('mexaNoA') }}</p>
      </section>

      <section class="passos">
        <h2>{{ i18n.t('explorar.passoAPasso') }}</h2>
        <app-passo-a-passo [passos]="passos()" />
      </section>
    }

    <app-conceitos-topico [conceitos]="conceitos" />
  </div>

  <div treinar>
    <app-area-treino [gerador]="gerador" />
  </div>
</app-topico-layout>
