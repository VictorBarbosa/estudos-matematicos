<app-topico-layout topicoId="sistemas-lineares">
  <div explorar class="explorar">
    <section class="painel">
      <h2>{{ texto('primeiraEquacao') }}</h2>
      <div class="grade-controles">
        <app-controle-parametro [(valor)]="a1" [rotulo]="texto('a1')" [min]="-8" [max]="8" />
        <app-controle-parametro [(valor)]="b1" [rotulo]="texto('b1')" [min]="-8" [max]="8" />
        <app-controle-parametro [(valor)]="c1" rotulo="c₁" [min]="-20" [max]="20" />
      </div>
    </section>

    <section class="painel">
      <h2>{{ texto('segundaEquacao') }}</h2>
      <div class="grade-controles">
        <app-controle-parametro [(valor)]="a2" [rotulo]="texto('a2')" [min]="-8" [max]="8" />
        <app-controle-parametro [(valor)]="b2" [rotulo]="texto('b2')" [min]="-8" [max]="8" />
        <app-controle-parametro [(valor)]="c2" rotulo="c₂" [min]="-20" [max]="20" />
      </div>
    </section>

    <section class="destaque-formula">
      <app-formula [tex]="sistemaTex()" [bloco]="true" />
      <p class="observacao classificacao">{{ classificacao() }}</p>
    </section>

    <section>
      <h2>{{ texto('asDuasRetas') }}</h2>
      <app-math-plot
        [dominio]="dominio()"
        [curvas]="curvas()"
        [pontos]="pontos()"
        [descricao]="descricaoGrafico()"
        [altura]="400"
      />
      <p class="observacao">{{ texto('mexaNosCoeficientes') }}</p>
    </section>

    <section>
      <h2>{{ i18n.t('explorar.passoAPasso') }}</h2>
      <app-passo-a-passo [passos]="resolucao().passos" />
    </section>

    <app-conceitos-topico [conceitos]="conceitos" />
  </div>

  <div treinar>
    <app-area-treino [gerador]="gerador" />
  </div>
</app-topico-layout>
