<app-topico-layout topicoId="expressoes-algebricas">
  <div explorar class="explorar">
    <section class="painel grade-controles">
      <app-controle-parametro
        [(valor)]="a"
        [rotulo]="i18n.t('explorar.coefX2')"
        [min]="-5"
        [max]="5"
      />
      <app-controle-parametro
        [(valor)]="b"
        [rotulo]="i18n.t('explorar.coefX')"
        [min]="-8"
        [max]="8"
      />
      <app-controle-parametro
        [(valor)]="c"
        [rotulo]="i18n.t('explorar.termoConstante')"
        [min]="-10"
        [max]="10"
      />
      <app-controle-parametro
        [(valor)]="x"
        [rotulo]="texto('valorDeX')"
        [min]="-5"
        [max]="5"
        [dica]="texto('dicaValorDeX')"
      />
    </section>

    <section class="destaque-formula">
      <app-formula [tex]="expressao().paraTex()" [bloco]="true" />
      <app-formula [tex]="'\\text{para } x = ' + x() + ': \\quad ' + valor()" [bloco]="true" />
    </section>

    <section>
      <h2>{{ texto('substituindo') }}</h2>
      <app-passo-a-passo [passos]="passos()" />
    </section>

    <section>
      <h2>{{ texto('expressaoComoCurva') }}</h2>
      <app-math-plot
        [dominio]="dominio()"
        [curvas]="curvas()"
        [pontos]="pontos()"
        [descricao]="descricaoGrafico()"
        [altura]="340"
      />
      <p class="observacao">{{ texto('mudarX') }}</p>
    </section>

    <app-conceitos-topico [conceitos]="conceitos" />
  </div>

  <div treinar>
    <app-area-treino [gerador]="gerador" />
  </div>
</app-topico-layout>
