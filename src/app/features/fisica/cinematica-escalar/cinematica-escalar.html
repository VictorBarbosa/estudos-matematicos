<app-topico-layout topicoId="cinematica-escalar">
  <div explorar class="explorar">
    <section class="painel grade-controles">
      <app-controle-parametro
        [(valor)]="velocidadeInicial"
        [rotulo]="i18n.t('explorar.velocidadeInicial')"
        [min]="0"
        [max]="20"
      />
      <app-controle-parametro
        [(valor)]="aceleracao"
        [rotulo]="texto('aceleracaoMs2')"
        [min]="-5"
        [max]="6"
      />
      <app-controle-parametro
        [(valor)]="instante"
        [rotulo]="i18n.t('explorar.instanteT')"
        [min]="0"
        [max]="10"
      />
    </section>

    <section class="destaque-formula">
      <app-formula [tex]="velocidadeTex()" [bloco]="true" />
      <app-formula [tex]="posicaoTex()" [bloco]="true" />
    </section>

    <section>
      <h2>{{ texto('areaSobVelocidade') }}</h2>
      <app-math-plot
        [dominio]="dominio()"
        [curvas]="curvasVelocidade()"
        [areas]="areaDeslocamento()"
        [pontos]="pontos()"
        [descricao]="texto('descricaoVelocidade')"
        [altura]="360"
      />
      <app-passo-a-passo [passos]="analiseArea().passos" />
      <!-- A ênfase cai no verbo, que muda de lugar em cada língua. -->
      <p class="observacao" [innerHTML]="texto('aRegiaoSombreada')"></p>
    </section>

    <section>
      <h2>{{ texto('inclinacaoDaPosicao') }}</h2>
      <app-math-plot
        [dominio]="dominio()"
        [curvas]="curvasPosicao()"
        [pontos]="pontosPosicao()"
        [descricao]="texto('descricaoPosicao')"
        [altura]="360"
      />
      <p
        class="observacao"
        [innerHTML]="texto('aRetaTracejada', { v: formatar(estado().velocidade) })"
      ></p>
    </section>

    @if (torricelli(); as torricelli) {
      <section class="painel">
        <h2>{{ texto('quandoOTempo') }}</h2>
        <app-passo-a-passo [passos]="torricelli.passos" />
        <p class="observacao">{{ texto('torricelliNota') }}</p>
      </section>
    }

    <section class="painel">
      <h2>{{ texto('porQueOLimite') }}</h2>
      <app-formula [tex]="'\\Delta s_{frenagem} = \\frac{v_0^{2}}{2a}'" [bloco]="true" />
      <p class="observacao" [innerHTML]="texto('aDistanciaDeFrenagem')"></p>
    </section>

    <app-conceitos-topico [conceitos]="conceitos" />
  </div>

  <div treinar>
    <app-area-treino [gerador]="gerador" />
  </div>
</app-topico-layout>
