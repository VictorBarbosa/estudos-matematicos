<app-topico-layout topicoId="conceito-funcao">
  <div explorar class="explorar">
    <section class="seletor-pills" role="group" [attr.aria-label]="texto('relacaoATestar')">
      @for (opcao of relacoes; track opcao.id) {
        <button
          type="button"
          [class.ativo]="relacao().id === opcao.id"
          [attr.aria-pressed]="relacao().id === opcao.id"
          (click)="selecionar($index)"
        >
          {{ opcao.rotulo }}
        </button>
      }
    </section>

    <section class="destaque-formula">
      <app-formula [tex]="relacao().tex" [bloco]="true" />
      <p class="veredito-relacao" [attr.data-funcao]="relacao().ehFuncao">
        {{ relacao().ehFuncao ? texto('ehFuncao') : texto('naoEhFuncao') }}
      </p>
      <p class="observacao">{{ texto(relacao().id + '.explicacao') }}</p>
    </section>

    <section class="painel grade-controles">
      <app-controle-parametro
        [(valor)]="posicaoTeste"
        [rotulo]="texto('posicaoDaReta')"
        [min]="-7"
        [max]="7"
        [dica]="texto('dicaPosicao')"
      />
    </section>

    <section>
      <h2>{{ texto('testeDaReta') }}</h2>
      <app-math-plot
        [dominio]="dominio()"
        [curvas]="curvas()"
        [segmentos]="segmentos()"
        [pontos]="intersecoes()"
        [descricao]="descricaoGrafico()"
        [altura]="420"
      />
      <p class="observacao destaque-veredito">{{ veredito() }}</p>
      <p class="observacao">{{ texto('aRegraESimples') }}</p>
    </section>

    <app-conceitos-topico [conceitos]="conceitos" />
  </div>

  <div treinar>
    <app-area-treino [gerador]="gerador" />
  </div>
</app-topico-layout>
