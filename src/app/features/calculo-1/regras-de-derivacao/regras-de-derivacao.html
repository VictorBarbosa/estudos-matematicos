<app-topico-layout topicoId="regras-de-derivacao">
  <div explorar class="explorar">
    <section class="painel grade-controles">
      <app-controle-parametro
        [(valor)]="a"
        [rotulo]="i18n.t('explorar.coefX3')"
        [min]="-3"
        [max]="3"
      />
      <app-controle-parametro
        [(valor)]="b"
        [rotulo]="i18n.t('explorar.coefX2')"
        [min]="-5"
        [max]="5"
      />
      <app-controle-parametro
        [(valor)]="c"
        [rotulo]="i18n.t('explorar.coefX')"
        [min]="-6"
        [max]="6"
      />
      <app-controle-parametro
        [(valor)]="d"
        [rotulo]="i18n.t('explorar.termoConstante')"
        [min]="-6"
        [max]="6"
      />
      <app-controle-parametro
        [(valor)]="ponto"
        [rotulo]="texto('pontoDaTangente')"
        [min]="-3"
        [max]="3"
      />
    </section>

    <section class="destaque-formula">
      <app-formula [tex]="funcaoTex()" [bloco]="true" />
      <app-formula [tex]="derivadaTex()" [bloco]="true" />
      <app-formula [tex]="segundaTex()" [bloco]="true" />
    </section>

    <section>
      <h2>{{ texto('derivadaComoInclinacao') }}</h2>
      <app-math-plot
        [dominio]="dominio()"
        [curvas]="curvas()"
        [pontos]="pontos()"
        [descricao]="descricaoGrafico()"
        [altura]="400"
      />
      <p class="observacao">{{ texto('movaOPonto') }}</p>
    </section>

    <section>
      <h2>{{ i18n.t('explorar.passoAPasso') }}</h2>
      <app-passo-a-passo [passos]="analise().passos" />
    </section>

    <section class="painel">
      <h2>{{ i18n.t('explorar.erroMaisComum') }}</h2>
      <p class="observacao" [innerHTML]="texto('aDerivadaDeUmProduto')"></p>
      <app-formula [tex]="regraProdutoTex" [bloco]="true" />
    </section>

    <app-conceitos-topico [conceitos]="conceitos" />
  </div>

  <div treinar>
    <app-area-treino [gerador]="gerador" />
  </div>
</app-topico-layout>
