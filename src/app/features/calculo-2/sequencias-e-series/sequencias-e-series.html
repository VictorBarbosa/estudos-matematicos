<app-topico-layout topicoId="sequencias-e-series">
  <div explorar class="explorar">
    <section class="seletor-pills" role="group" [attr.aria-label]="texto('escolhaSerie')">
      @for (serie of series; track serie.id) {
        <button
          type="button"
          [class.ativo]="escolhida().id === serie.id"
          [attr.aria-pressed]="escolhida().id === serie.id"
          [attr.aria-label]="texto('serie_' + serie.id)"
          (click)="escolher(serie)"
        >
          <app-formula [tex]="serie.tex" />
        </button>
      }
    </section>

    <section class="painel grade-controles">
      <app-controle-parametro
        [(valor)]="quantidade"
        [rotulo]="texto('quantosTermos')"
        [min]="5"
        [max]="200"
      />
    </section>

    <section class="destaque-formula">
      <app-formula [tex]="escolhida().tex" [bloco]="true" />
      <app-formula [tex]="somaParcialTex()" [bloco]="true" />
    </section>

    <section>
      <h2>{{ texto('somasParciais') }}</h2>
      <app-math-plot
        [dominio]="dominio()"
        [curvas]="curvas()"
        [pontos]="pontos()"
        [descricao]="descricaoGrafico()"
        [altura]="360"
      />
      <p class="observacao">
        {{ escolhida().soma === null ? texto('leituraDiverge') : texto('leituraConverge') }}
      </p>
    </section>

    <app-conceitos-topico [conceitos]="conceitos" />
  </div>

  <div treinar>
    <app-area-treino [gerador]="gerador" />
  </div>
</app-topico-layout>
