<app-topico-layout topicoId="integral-indefinida">
  <div explorar class="explorar">
    <section class="painel grade-controles">
      <app-controle-parametro
        [(valor)]="a"
        [rotulo]="i18n.t('explorar.coefX2')"
        [min]="-6"
        [max]="6"
      />
      <app-controle-parametro
        [(valor)]="b"
        [rotulo]="i18n.t('explorar.coefX')"
        [min]="-6"
        [max]="6"
      />
      <app-controle-parametro
        [(valor)]="c"
        [rotulo]="i18n.t('explorar.termoConstante')"
        [min]="-5"
        [max]="5"
      />
      <app-controle-parametro
        [(valor)]="constante"
        [rotulo]="texto('constanteC')"
        [min]="-6"
        [max]="6"
        [dica]="texto('deslocaAPrimitiva')"
      />
    </section>

    <section class="destaque-formula">
      <app-formula [tex]="integralTex()" [bloco]="true" />
    </section>

    <section class="painel">
      <h2>{{ texto('conferindoPelaDerivada') }}</h2>
      <app-formula [tex]="conferenciaTex()" [bloco]="true" />
      <p class="observacao" [attr.data-confere]="confere()">
        {{ confere() ? texto('confereSim') : texto('confereNao') }}
        {{ texto('sempreConfira') }}
      </p>
    </section>

    <section>
      <h2>{{ texto('aFamiliaDePrimitivas') }}</h2>
      <app-math-plot
        [dominio]="dominio()"
        [curvas]="curvas()"
        [descricao]="descricaoGrafico()"
        [altura]="400"
      />
      <p class="observacao">{{ texto('curvasTracejadas') }}</p>
    </section>

    <section>
      <h2>{{ i18n.t('explorar.passoAPasso') }}</h2>
      <app-passo-a-passo [passos]="analise().passos" />
    </section>

    <app-conceitos-topico [conceitos]="conceitos" />
  </div>

  <div treinar>
    <app-area-treino [gerador]="gerador" />
  </div>
</app-topico-layout>
