<app-topico-layout topicoId="numeros-decimais">
  <div explorar class="explorar">
    <section class="conversao">
      <h2>{{ texto('deFracaoParaDecimal') }}</h2>
      <div class="controles-linha">
        <app-controle-parametro
          [(valor)]="numerador"
          [rotulo]="i18n.t('explorar.numerador')"
          [min]="1"
          [max]="50"
        />
        <app-controle-parametro
          [(valor)]="denominador"
          [rotulo]="i18n.t('explorar.denominador')"
          [min]="1"
          [max]="50"
        />
      </div>

      <app-formula
        [tex]="fracao().paraTex() + ' = ' + decimal().texto.replace('.', '{,}')"
        [bloco]="true"
      />

      <!-- A ênfase cai em palavras diferentes em cada língua, então o <strong>
           viaja dentro da frase traduzida. -->
      @if (decimal().ehPeriodico) {
        <p
          class="observacao"
          [innerHTML]="
            texto('periodicoExplicacao', {
              periodo: decimal().periodo,
              denominador: motivoDoPeriodo().denominador,
              fatores: motivoDoPeriodo().outrosFatores,
            })
          "
        ></p>
      } @else {
        <p
          class="observacao"
          [innerHTML]="texto('finitoExplicacao', { denominador: motivoDoPeriodo().denominador })"
        ></p>
      }

      <app-passo-a-passo [passos]="conversao().passos" />
    </section>

    <section class="reta">
      <h2>{{ texto('aproximacoesNaReta') }}</h2>
      <p class="observacao">{{ texto('cadaCasa') }}</p>
      <app-math-plot
        [dominio]="dominioReta()"
        [marcas]="marcas()"
        [descricao]="descricaoReta()"
        [mostrarEixoY]="false"
        [altura]="160"
      />
    </section>

    <section class="geratriz">
      <h2>{{ texto('deDizimaParaFracao') }}</h2>
      <app-controle-parametro
        [(valor)]="periodo"
        [rotulo]="texto('periodoUmDigito')"
        [min]="1"
        [max]="8"
      />
      <app-formula
        [tex]="'0{,}\\overline{' + periodo() + '} = ' + geratriz().resultado.paraTex()"
        [bloco]="true"
      />
      <p class="observacao">{{ texto('aSubtracao') }}</p>
      <app-passo-a-passo [passos]="geratriz().passos" />
    </section>

    <app-conceitos-topico [conceitos]="conceitos" />
  </div>

  <div treinar>
    <app-area-treino [gerador]="gerador" />
  </div>
</app-topico-layout>
