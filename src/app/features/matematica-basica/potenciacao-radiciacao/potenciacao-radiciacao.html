<app-topico-layout topicoId="potenciacao-radiciacao">
  <div explorar class="explorar">
    <section
      class="propriedades-seletor"
      role="group"
      [attr.aria-label]="texto('propriedadeADemonstrar')"
    >
      @for (opcao of propriedades; track opcao.valor) {
        <button
          type="button"
          [class.ativo]="propriedade() === opcao.valor"
          [attr.aria-pressed]="propriedade() === opcao.valor"
          (click)="definirPropriedade(opcao.valor)"
        >
          {{ opcao.rotulo }}
        </button>
      }
    </section>

    <section class="controles">
      <app-controle-parametro [(valor)]="base" [rotulo]="texto('baseA')" [min]="2" [max]="10" />
      <app-controle-parametro [(valor)]="m" [rotulo]="texto('expoenteM')" [min]="0" [max]="6" />
      <app-controle-parametro
        [(valor)]="n"
        [rotulo]="i18n.t('explorar.expoenteN')"
        [min]="0"
        [max]="6"
      />
    </section>

    <section class="resultado">
      <app-formula [tex]="potenciaTex() + ' = ' + valor()" [bloco]="true" />
    </section>

    <section class="passos">
      <h2>{{ texto('porQueFunciona') }}</h2>
      <app-passo-a-passo [passos]="resolucao().passos" />
    </section>

    <section class="grafico">
      <h2>{{ texto('potenciaComoPonto') }}</h2>
      <app-math-plot
        [dominio]="dominio()"
        [curvas]="curvas()"
        [pontos]="pontos()"
        [descricao]="descricaoCurva()"
        [altura]="340"
      />
      <p class="observacao">{{ texto('expoentesNegativos') }}</p>
    </section>

    <section class="radiciacao">
      <h2>{{ texto('simplificandoRaizes') }}</h2>
      <app-controle-parametro
        [(valor)]="radicando"
        [rotulo]="texto('radicando')"
        [min]="2"
        [max]="400"
        [dica]="texto('dicaRadicando')"
      />

      <app-formula [tex]="'\\sqrt{' + radicando() + '} = ' + raizTex()" [bloco]="true" />

      <p class="observacao">
        {{ raizEhExata() ? texto('raizExata') : texto('raizComResto') }}
      </p>

      <app-passo-a-passo [passos]="raiz().passos" />
    </section>

    <app-conceitos-topico [conceitos]="conceitos" />
  </div>

  <div treinar>
    <app-area-treino [gerador]="gerador" />
  </div>
</app-topico-layout>
