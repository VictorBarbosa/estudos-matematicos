<app-topico-layout topicoId="circunferencia">
  <div explorar class="explorar">
    <section class="painel grade-controles">
      <app-controle-parametro
        [(valor)]="centroX"
        [rotulo]="texto('centroX')"
        [min]="-8"
        [max]="8"
      />
      <app-controle-parametro
        [(valor)]="centroY"
        [rotulo]="texto('centroY')"
        [min]="-8"
        [max]="8"
      />
      <app-controle-parametro
        [(valor)]="raio"
        [rotulo]="i18n.t('explorar.raio')"
        [min]="1"
        [max]="10"
      />
    </section>

    <section class="destaque-formula">
      <app-formula [tex]="reduzidaTex()" [bloco]="true" />
      <p class="observacao">{{ texto('formaReduzida') }}</p>
      <app-formula [tex]="geralTex()" [bloco]="true" />
      <p class="observacao">{{ texto('formaGeral') }}</p>
    </section>

    <section class="painel">
      <h2>{{ texto('ondeEstaOPonto') }}</h2>
      <div class="grade-controles">
        <app-controle-parametro
          [(valor)]="testeX"
          [rotulo]="texto('testeX')"
          [min]="-12"
          [max]="12"
        />
        <app-controle-parametro
          [(valor)]="testeY"
          [rotulo]="texto('testeY')"
          [min]="-12"
          [max]="12"
        />
      </div>
      <p class="observacao posicao" [attr.data-posicao]="posicao()">{{ descricaoPosicao() }}</p>
    </section>

    <section>
      <h2>{{ texto('circunferenciaNoPlano') }}</h2>
      <app-math-plot
        [dominio]="dominio()"
        [curvas]="curvas()"
        [pontos]="pontos()"
        [segmentos]="segmentos()"
        [descricao]="descricaoGrafico()"
        [altura]="420"
      />
      <p class="observacao">{{ texto('aLinhaCheia') }}</p>
    </section>

    <section>
      <h2>{{ texto('daGeralAReduzida') }}</h2>
      <app-passo-a-passo [passos]="conversao().passos" />
    </section>

    <app-conceitos-topico [conceitos]="conceitos" />
  </div>

  <div treinar>
    <app-area-treino [gerador]="gerador" />
  </div>
</app-topico-layout>
