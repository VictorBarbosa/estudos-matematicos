<article class="topico">
  <app-painel-etapa [topicoId]="topicoId()" />

  <header class="cabecalho">
    <h1>{{ titulo() }}</h1>
    <p class="descricao">{{ descricao() }}</p>

    <!-- Só a interface foi traduzida: quem lê em francês ou inglês fica
         sabendo disso antes de abrir o primeiro exercício, não depois. -->
    @if (i18n.idioma() !== 'pt') {
      <p class="aviso-idioma">
        {{ i18n.t('idioma.conteudoEmPortugues', { idioma: nomeDoIdioma[i18n.idioma()] }) }}
      </p>
    }
  </header>

  <div class="abas" role="tablist" [attr.aria-label]="i18n.t('topico.secoes')" (keydown)="aoTeclar($event)">
    @for (nome of abas; track nome) {
      <button
        #botaoAba
        type="button"
        role="tab"
        class="aba"
        [id]="'aba-' + nome"
        [attr.aria-controls]="'painel-' + nome"
        [attr.aria-selected]="aba() === nome"
        [attr.tabindex]="aba() === nome ? 0 : -1"
        [class.ativa]="aba() === nome"
        (click)="selecionar(nome)"
      >
        {{ i18n.t(rotulos[nome]) }}
      </button>
    }
  </div>

  <div
    id="painel-explorar"
    role="tabpanel"
    aria-labelledby="aba-explorar"
    [hidden]="aba() !== 'explorar'"
  >
    <ng-content select="[explorar]" />
  </div>

  <div
    id="painel-treinar"
    role="tabpanel"
    aria-labelledby="aba-treinar"
    [hidden]="aba() !== 'treinar'"
    class="painel-treino"
  >
    <ng-content select="[treinar]" />
    <app-painel-progresso [topicoId]="topicoId()" />
  </div>
</article>
