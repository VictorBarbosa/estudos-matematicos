# Publica o preparatório no GitHub Pages.
#
# Partiu do template "Static HTML" do GitHub, adaptado para uma aplicação
# Angular: o Pages serve arquivos estáticos, mas eles precisam ser construídos
# antes — não há index.html na raiz do repositório, só código-fonte.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` instala exatamente o que está no package-lock e falha se ele
      # estiver dessincronizado do package.json.
      - name: Instalar dependências
        run: npm ci

      # O site só vai ao ar se a suíte passar.
      - name: Rodar os testes
        run: npm test -- --watch=false

      # Constrói com o base-href do repositório e gera 404.html e .nojekyll,
      # que são o que faz as rotas do Angular funcionarem no Pages.
      - name: Construir para o Pages
        run: npm run build:pages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Apenas a saída compilada, não o repositório inteiro.
          path: 'dist/EstudosMatematicos/browser'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
