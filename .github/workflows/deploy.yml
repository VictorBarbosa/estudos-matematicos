# Publica o preparatório no GitHub Pages a cada push na main.
#
# O deploy usa o fluxo oficial de artefato do Pages, e não uma branch gh-pages:
# nada de build versionado no repositório. Para que funcione, o Pages precisa
# estar configurado em Settings → Pages → Source: GitHub Actions.
name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  # Permite republicar manualmente pela aba Actions, sem precisar de um commit.
  workflow_dispatch:

# O token só precisa ler o código e publicar as páginas.
permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez. Pushes em sequência não cancelam uma publicação em curso,
# para não deixar o site num estado intermediário.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` respeita o package-lock e falha se ele estiver dessincronizado.
      - name: Instalar dependências
        run: npm ci

      # O site só vai ao ar se a suíte passar.
      - name: Rodar os testes
        run: npm test -- --watch=false

      - name: Construir para o Pages
        run: npm run build:pages

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/EstudosMatematicos/browser

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
